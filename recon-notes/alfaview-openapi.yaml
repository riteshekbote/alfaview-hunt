        "401":
          description: A guest with the provided information could not be found and authenticated.
        "422":
          description: An entity in the request cannot be processed. Either a validation (e.g. ID validity) did not succeed or a precondition was not met. This also applies if a guest link was used to authenticate. Please use the "Authenticate a guest (guest link)" endpoint instead.
      summary: Authenticate a Guest (Group Link)
      tags:
        - Authentication
