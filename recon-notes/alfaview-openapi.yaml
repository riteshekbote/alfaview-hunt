components:
  schemas:
    APICredentials:
      additionalProperties: false
      properties:
        clientId:
          description: The alias of the API key.
          type: string
        companyId:
          description: The company ID.
          type: string
        key:
          description: The API key to authenticate.
          type: string
      required:
        - companyId
        - clientId
        - key
      type: object
    AccessToken:
      additionalProperties: false
      properties:
        accessToken:
          description: Access tokens are returned after successful authentication as a base64-encoded string. Use the token in the 'Authorization' header in order to access the API.
          type: string
      required:
        - accessToken
      type: object
    Attendance:
      additionalProperties: false
      properties:
        displayName:
          description: The name of the user that was displayed in UIs at the time of the attendance.
          type: string
        from:
          description: The start time.
          examples:
            - "2024-09-22T11:00:00Z"
          format: date-time
          type: string
        to:
          description: The end time.
          examples:
            - "2024-09-22T12:00:00Z"
          format: date-time
          type: string
      required:
        - displayName
        - from
        - to
      type: object
    AuthenticateGroupLinkRequestBody:
      additionalProperties: false
      properties:
        accessKey:
          description: The access key from the group link.
          type: string
        companyId:
          description: The company ID.
          examples:
            - 0123456789ABCDEFGHIJKLMNOP
          type: string
        displayName:
          description: The name of the guest that is displayed in UIs.
          maximum: 256
          type: string
        externalId:
          description: The external ID can be used to derive a reproducible user ID to prevent simultaneous use. If that is desired, the caller is responsible for providing a unique value per user.
          maximum: 256
          minimum: 32
          type:
            - string
            - "null"
        roomId:
          description: The room ID from the group link.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
      required:
        - companyId
        - roomId
        - accessKey
        - displayName
      type: object
    AuthenticateGuestLinkRequestBody:
      additionalProperties: false
      properties:
        accessKey:
          description: The access key from the guest link.
          type: string
        companyId:
          description: The company ID.
          examples:
            - 0123456789ABCDEFGHIJKLMNOP
          type: string
        displayName:
          description: If set, this overrides the stored name of the guest that is displayed in UIs.
          maximum: 256
          type:
            - string
            - "null"
        roomId:
          description: The room ID from the guest link.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
      required:
        - companyId
        - roomId
        - accessKey
      type: object
    CreateGroupLinksRequestBody:
      additionalProperties: false
      properties:
        create:
          description: The group links.
          items:
            $ref: "#/components/schemas/GroupLinkCreate"
          minItems: 1
          type:
            - array
            - "null"
        origin:
          description: Specifies the creator or reason for the creation of the group links (e.g., 'my external tool' or 'initial meeting delayed').
          type:
            - string
            - "null"
      required:
        - create
      type: object
    CreateGuestLinksRequestBody:
      additionalProperties: false
      properties:
        create:
          description: The guest links.
          items:
            $ref: "#/components/schemas/GuestLinkCreate"
          minItems: 1
          type:
            - array
            - "null"
        origin:
          description: Specifies the creator or reason for the creation of the guest links (e.g., 'my external tool' or 'initial meeting delayed').
          type:
            - string
            - "null"
        timezone:
          description: The time zone to use in the notification emails. Can be 'UTC', 'Local' or a TZ identifier from the IANA time zone database. If empty, the default is 'Europe/Berlin'.
          examples:
            - Europe/Berlin
          type:
            - string
            - "null"
      required:
        - create
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GroupLink:
      additionalProperties: false
      properties:
        accessKey:
          description: The access key.
          type: string
        createdAt:
          description: The creation timestamp.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        createdBy:
          description: The creator user ID.
          type: string
        description:
          description: A description of the group link.
          type: string
        dialInAllowed:
          description: If true, the group link is allowed to be used via dial-in.
          type: boolean
        dialInCode:
          description: The dial-in authentication code for the group link.
          type: string
        id:
          description: The group link ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        joinLink:
          deprecated: true
          description: Deprecated. Use joinUrl instead.
          type: string
        joinUrl:
          description: The URL of the room join page. That page allows the user to set a display name and to choose whether to join the room with the native client or the web client.
          type: string
        origin:
          description: String that specifies the creator or reason for the creation of the group link (e.g., 'my external tool' or 'initial meeting delayed').
          type: string
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        roomId:
          description: The room ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        validFrom:
          description: The group link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: The group link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type: string
      required:
        - id
        - roomId
        - description
        - permissionGroupId
        - createdBy
        - createdAt
        - joinLink
        - joinUrl
        - accessKey
        - origin
        - dialInAllowed
        - dialInCode
      type: object
    GroupLinkAuthenticationInfo:
      additionalProperties: false
      properties:
        accessToken:
          description: "Access tokens are returned after successful authentication as a base64-encoded string. Use the token in the 'Authorization' header in order to access the API. Note: Can be empty if the group link is not yet / no longer valid."
          type: string
        clientLaunchUrl:
          description: The URL to join the room with the (installed) alfaview app. Can be empty if the group link is not yet / no longer valid.
          examples:
            - alfaview://apis.alfaview.com:443?companyId={company-id}&roomId={room-id}&token={token}
          type: string
        displayName:
          description: The name of the guest that is displayed in UIs.
          type: string
        participantId:
          description: The group link ID. Can be empty if the group link is not yet / no longer valid.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        tokenExpiresAt:
          description: Time at which the access token expires. Can be empty if the group link is not yet / no longer valid.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validFrom:
          description: Time at which the group link becomes valid, i.e., authentication becomes possible.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: Time at which the group link becomes invalid, i.e., authentication is not possible anymore.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        webclientLaunchUrl:
          description: The URL to join the room with the browser. Can be empty if the guest link is not yet / no longer valid.
          examples:
            - https://webclient.alfaview.com/?--url=alfaview%3A%2F%2Fapis.alfaview.com%3A443%3FcompanyId%3D{company-id}%26roomId%3D{room-id}%26token%3D{token}
          type: string
      required:
        - validFrom
        - validUntil
        - displayName
      type: object
    GroupLinkCreate:
      additionalProperties: false
      properties:
        description:
          description: The group link description.
          type: string
        dialInAllowed:
          description: If true, the group link is allowed to be used via dial-in.
          type: boolean
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        validFrom:
          description: The group link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type:
            - string
            - "null"
        validUntil:
          description: The group link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type:
            - string
            - "null"
      required:
        - description
        - permissionGroupId
        - dialInAllowed
      type: object
    GroupLinkUpdate:
      additionalProperties: false
      properties:
        description:
          description: The group link description.
          type:
            - string
            - "null"
        dialInAllowed:
          description: If true, the group link is allowed to be used via dial-in.
          type:
            - boolean
            - "null"
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type:
            - string
            - "null"
        validFrom:
          description: The group link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type:
            - string
            - "null"
        validUntil:
          description: The group link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type:
            - string
            - "null"
      type: object
    GuestLink:
      additionalProperties: false
      properties:
        accessKey:
          description: The access key.
          type: string
        createdAt:
          description: The creation timestamp.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        createdBy:
          description: The creator user ID.
          type: string
        dialInAllowed:
          description: If true, the guest link is allowed to be used via dial-in.
          type: boolean
        dialInCode:
          description: The dial-in authentication code.
          type: string
        displayName:
          description: The name of the participant using the guest link that is displayed in UIs.
          type: string
        emailAddress:
          description: The email address associated with the guest link.
          format: email
          type: string
        id:
          description: The guest link ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        joinUrl:
          description: The URL of the room join page. That page allows to choose whether to join the room with the native client or the web client
          type: string
        locale:
          description: The locale settings (e.g., UI language).
          enum:
            - de-DE
            - en-US
          type: string
        origin:
          description: String that specifies the creator or reason for the creation of the guest link (e.g., 'my external tool' or 'initial meeting delayed').
          type: string
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        roomId:
          description: The room ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        validFrom:
          description: The guest link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: The guest link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type: string
      required:
        - id
        - roomId
        - createdBy
        - createdAt
        - permissionGroupId
        - accessKey
        - emailAddress
        - locale
        - origin
        - dialInAllowed
        - dialInCode
        - joinUrl
      type: object
    GuestLinkAuthenticationInfo:
      additionalProperties: false
      properties:
        accessToken:
          description: "Access tokens are returned after successful authentication as a base64-encoded string. Use the token in the 'Authorization' header in order to access the API. Note: Can be empty if the guest link is not yet / no longer valid."
          type: string
        clientLaunchUrl:
          description: The URL to join the room with the (installed) alfaview app. Can be empty if the guest link is not yet / no longer valid.
          examples:
            - alfaview://apis.alfaview.com:443?companyId={company-id}&roomId={room-id}&token={token}
          type: string
        displayName:
          description: The name of the guest that is displayed in UIs.
          type: string
        participantId:
          description: The guest link ID. Can be empty if the guest link is not yet / no longer valid.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        tokenExpiresAt:
          description: Time at which the access token expires. Can be empty if the guest link is not yet / no longer valid.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validFrom:
          description: Time at which the guest link becomes valid, i.e., authentication becomes possible.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: Time at which the guest link becomes invalid, i.e., authentication is not possible anymore.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        webclientLaunchUrl:
          description: The URL to join the room with the browser. Can be empty if the guest link is not yet / no longer valid.
          examples:
            - https://webclient.alfaview.com/?--url=alfaview%3A%2F%2Fapis.alfaview.com%3A443%3FcompanyId%3D{company-id}%26roomId%3D{room-id}%26token%3D{token}
          type: string
      required:
        - validFrom
        - validUntil
        - displayName
      type: object
    GuestLinkCreate:
      additionalProperties: false
      properties:
        dialInAllowed:
          description: If true, the guest link is allowed to be used via dial-in.
          type: boolean
        displayName:
          description: The name of the guest that is displayed in UIs.
          type: string
        emailAddress:
          description: The email address associated with the guest link.
          format: email
          type: string
        locale:
          description: The locale settings (e.g., UI language) for the guest link.
          enum:
            - de-DE
            - en-US
          type: string
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        sendEmail:
          description: If true, an information email with the guest link will be sent to the associated email address.
          type: boolean
        validFrom:
          description: The guest link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: The guest link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type: string
      required:
        - emailAddress
        - displayName
        - locale
        - permissionGroupId
        - dialInAllowed
      type: object
    GuestLinkUpdate:
      additionalProperties: false
      properties:
        dialInAllowed:
          description: If true, the guest link is allowed to be used via dial-in.
          type: boolean
        displayName:
          description: The name of the guest that is displayed in UIs.
          type: string
        emailAddress:
          description: The email address associated with the guest link.
          format: email
          type: string
        locale:
          description: The locale settings (e.g., UI language) for the guest link.
          enum:
            - de-DE
            - en-US
          type: string
        permissionGroupId:
          description: The permission group ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type:
            - string
            - "null"
        sendEmail:
          description: If true, an information email with the updated guest link information will be sent to the associated email address.
          type: boolean
        timezone:
          description: The time zone to use in the notification emails. Can be 'UTC', 'Local' or a TZ identifier from the IANA time zone database. If empty, the default is 'Europe/Berlin'.
          examples:
            - Europe/Berlin
          type:
            - string
            - "null"
        validFrom:
          description: The guest link is valid from this point in time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        validUntil:
          description: The guest link is valid until this point in time.
          examples:
            - "2024-09-23T12:34:56Z"
          format: date-time
          type: string
      required:
        - displayName
        - sendEmail
      type: object
    ID:
      additionalProperties: false
      properties:
        id:
          description: A unique identifier.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
      required:
        - id
      type: object
    InviteUserPermissions:
      additionalProperties: false
      properties:
        manageCompany:
          description: If true, the user can manage company settings. Implies userAdmin, roomAdmin and userShow.
          type: boolean
        roomAdmin:
          description: If true, the user can create, update and delete any room. Implies roomList and roomCreate.
          type: boolean
        roomCreate:
          description: If true, the user can create rooms for their company.
          type: boolean
        roomList:
          description: If true, the user can list all rooms in their company.
          type: boolean
        userAdmin:
          description: If true, the user can create, update and delete other users, send password reset mails and resend sign-up mails for new users. Implies userList.
          type: boolean
        userList:
          description: If true, the user can list all users in their company.
          type: boolean
        userShow:
          description: If true, the user can see the user names of all users in rooms they can access.
          type: boolean
      required:
        - manageCompany
        - userAdmin
        - userList
        - userShow
        - roomAdmin
        - roomList
        - roomCreate
      type: object
    LanguageSettings:
      additionalProperties: false
      properties:
        defaultSpokenLanguage:
          description: The default spoken language.
          type: string
        targetTranscriptionLanguages:
          description: The languages that the translation feature is translating the spoken words to. The translation into all of these languages is happening permanently as long as the feature is enabled, even if no participant has selected that language. To get the available transcription languages, refer to the 'List Available Languages' endpoint.
          items:
            type: string
          type:
            - array
            - "null"
        transcriptionEnabled:
          description: If true, the transcription feature is enabled in this room.
          type: boolean
        transcriptionType:
          description: The type of transcription as selectable for room administrators in the client.
          enum:
            - simple_transcription
            - digital_interpreter
          type: string
      required:
        - transcriptionEnabled
        - transcriptionType
      type: object
    LanguageSettingsEdit:
      additionalProperties: false
      properties:
        defaultSpokenLanguage:
          description: The default spoken language.
          type:
            - string
            - "null"
        targetTranscriptionLanguages:
          description: The languages that the spoken words are translated into. The translation into all of these languages is happening continuously as long as the feature is enabled, even if no participant has selected that language. To get the available transcription languages, refer to the 'List Available Languages' endpoint.
          items:
            type: string
          type:
            - array
            - "null"
        transcriptionEnabled:
          description: If true, the transcription feature is enabled in this room.
          type:
            - boolean
            - "null"
        transcriptionType:
          description: The type of transcription as selectable for room administrators in the client.
          enum:
            - simple_transcription
            - digital_interpreter
          type:
            - string
            - "null"
      type: object
    Languages:
      additionalProperties: false
      properties:
        transcription:
          description: The available transcription languages.
          items:
            type: string
          type:
            - array
            - "null"
        translation:
          description: The available language pairings for translation.
          items:
            $ref: "#/components/schemas/Translation"
          type:
            - array
            - "null"
      type: object
    Meeting:
      additionalProperties: false
      properties:
        agenda:
          description: The meeting agenda. HTML is not allowed.
          type: string
        canJoin:
          description: If true, participants can join the meeting at the time of the request.
          type: boolean
        canJoinAfter:
          description: The timestamp of when participants can join the meeting. Will be omitted if the meeting has ended.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        canceledAt:
          description: The timestamp of when the meeting was canceled (if it was canceled).
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        createdAt:
          description: The creation timestamp.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        createdBy:
          description: The creator user ID.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        earlyAccessMinutes:
          description: The duration of the early access period to the meeting room in minutes. In this period, moderators or administrators can join the meeting. The meeting creator can always join 1 hour before the meeting starts. Regular invitees can never join early.
          format: int64
          type: integer
        end:
          description: The end time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        groupLinks:
          additionalProperties:
            type: string
          description: The group links for the meeting.
          type: object
        guestLinks:
          description: The guest links for the meeting.
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: The meeting ID. It can also be used as a 'roomId' to access the meeting room.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        roomAvailable:
          description: If true, the meeting room is currently available.'
          type: boolean
        start:
          description: The start time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        state:
          description: The current state.
          enum:
            - scheduled
            - ongoing
            - ended
            - canceled
          type: string
        timezone:
          description: The time zone used for time information.
          examples:
            - Europe/Berlin
          type: string
        title:
          description: The meeting.
          type: string
      required:
        - id
        - title
        - start
        - end
        - timezone
        - roomAvailable
        - createdAt
        - createdBy
        - state
        - canJoin
      type: object
    MeetingCancellation:
      additionalProperties: false
      properties:
        reason:
          description: The reason for the cancellation. HTML is not allowed.
          type:
            - string
            - "null"
        sendNotification:
          description: If true, a notification email will be sent to the creator and all invitees.
          type: boolean
      required:
        - sendNotification
      type: object
    MeetingCreate:
      additionalProperties: false
      properties:
        agenda:
          description: The meeting agenda. HTML is not allowed.
          type:
            - string
            - "null"
        earlyAccessMinutes:
          description: The duration of the early access period to the meeting room in minutes. In this period, moderators or administrators can join the meeting. The meeting creator can always join 1 hour before the meeting starts. Regular invitees can never join early.
          format: int64
          maximum: 30
          minimum: 0
          type:
            - integer
            - "null"
        end:
          description: The end time.
          examples:
            - "2024-09-22T12:34:56Z"
          format: date-time
          type: string
        groupLinks:
          description: The group links for the meeting. If not provided, four default group links (moderator, participant, guest, spectator) will be created. If an empty list is provided, no links will be created.
          items:
            $ref: "#/components/schemas/GroupLinkCreate"
          type:
            - array
            - "null"
        guestLinks:
          description: The guest links for the meeting.
          items:
            $ref: "#/components/schemas/GuestLinkCreate"
          type:
            - array
            - "null"
        passcodeRequired:
          description: If true, a passcode is required to enter the meeting room.
          type:
            - boolean
            - "null"
        roomFeatures:
          $ref: "#/components/schemas/RoomFeaturesEdit"
          description: The feature configuration. If no state is specified for a feature, 'default' is assumed.
