paths:
  /v2/auth/api-key:
    post:
      description: Authenticates via an API key and returns an access token. Refer to the [related support article](https://support.alfaview.com/en/developers/request-your-api-credentials/) to generate API keys.
      operationId: AuthenticateAPIKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APICredentials"
        description: The API credentials.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
          description: The request was processed successfully.
        "400":
          description: The request was not valid.
        "401":
          description: The authentication did not succeed because of invalid credentials.
        "403":
          description: The authentication did not succeed because of the account's status or permissions (e.g., account is inactive).
        "422":
          description: An entity in the request cannot be processed. Either a validation (e.g. ID validity) did not succeed or a precondition was not met.
      summary: Authenticate via API Key
      tags:
        - Authentication
      x-sort-index: 0
  /v2/auth/group-link:
