info:
  description: |
    ## Format information
    * All time fields are returned in RFC3339 format and in UTC if not mentioned otherwise.

    ## Authentication
    ### API Key and Credentials
    All API requests require an access token for authorization. Access tokens can be obtained by authenticating using any of the following endpoints:
    - [Authenticate via API key](https://apis.alfaview.com/v2/docs/openapi#/operations/AuthenticateAPIKey)
    - [Authenticate via password](https://apis.alfaview.com/v2/docs/openapi#/operations/AuthenticatePassword)
    - [Authenticate a guest (guest link)](https://apis.alfaview.com/v2/docs/openapi#/operations/AuthenticateGuestLink)
    - [Authenticate a guest (group link)](https://apis.alfaview.com/v2/docs/openapi#/operations/AuthenticateGroupLink)
    The access token is returned as a base64-encoded string. It needs to be used as the value in the `Authorization` header in all subsequent API requests.

    ### Token Time-To-Live (TTL)
    Access tokens are valid for 1 hour. After this period, tokens will be expired and a new token must be obtained.

    ## Permissions
    Except for endpoints affecting "own" resources (e.g., "Get own Meeting"), returning static resources (e.g., "List Available Languages") and authentication endpoints, all endpoints require the caller to have specific permissions. There are two distinct types of permissions that can be applied to users independently.
    ### Room permissions
    Room permissions are the permissions of users in a particular room. If users have no permissions for a room, they cannot get any information about the room and it is excluded from room lists (except they have the user permissions to list all rooms).

    To edit room properties or create resources (e.g., links, subrooms) for a room, users need room administrator permissions or user permissions that permit those actions.
    For further information please refer to the [room permissions section in the support center](https://support.alfaview.com/en/administration/general/room-permissions/).
    ### User permissions
    User permissions are high level permissions applied to users independently from specific rooms.
    For further information please refer to the [user permissions section in the support center](https://support.alfaview.com/en/administration/general/user-permissions/).
  title: alfaview
  version: "2"
